<svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 400 300"
        width="400"
        height="300"
>
    <!-- Фон телевизора -->
    <rect x="50" y="50" width="300" height="200" rx="10" ry="10" fill="#1d1d1d" />
    <rect x="60" y="60" width="280" height="180" rx="5" ry="5" fill="#333" />

    <!-- Экран -->
    <rect x="70" y="70" width="260" height="160" rx="5" ry="5" fill="#d1d1d1" />

    <!-- Разбитая трещина от края до края -->
    <path
            d="M70 140 L100 120 L130 160 L160 140 L190 180 L220 160 L250 190 L280 170 L330 200"
            stroke="#000"
            stroke-width="6"
            fill="none"
    />

    <!-- Подставка телевизора -->
    <rect x="150" y="260" width="100" height="10" fill="#444" rx="2" ry="2" />
    <rect x="175" y="270" width="50" height="10" fill="#333" rx="2" ry="2" />
</svg>
