name: Deploy to hoster.by

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: hosterby-live
  cancel-in-progress: false

jobs:
  build_and_upload:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.HOSTERBY_FTP_SERVER }}
    steps:
      - name: Check FTP settings
        id: config
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "::warning::HOSTERBY_FTP_SERVER is not set, skipping upload to hoster.by"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.enabled == 'true'
      - uses: actions/setup-node@v4
        if: steps.config.outputs.enabled == 'true'
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        if: steps.config.outputs.enabled == 'true'
      - run: npm run build
        if: steps.config.outputs.enabled == 'true'
        env:
          CI: true
          REACT_APP_TELEGRAM_BOT_TOKEN: ${{ secrets.REACT_APP_TELEGRAM_BOT_TOKEN }}
          REACT_APP_TELEGRAM_CHAT_ID: ${{ secrets.REACT_APP_TELEGRAM_CHAT_ID }}
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        if: steps.config.outputs.enabled == 'true'
        with:
          server: ${{ secrets.HOSTERBY_FTP_SERVER }}
          username: ${{ secrets.HOSTERBY_FTP_USERNAME }}
          password: ${{ secrets.HOSTERBY_FTP_PASSWORD }}
          protocol: ${{ vars.HOSTERBY_FTP_PROTOCOL || 'ftps' }}
          port: ${{ vars.HOSTERBY_FTP_PORT || 21 }}
          local-dir: ./build/
          server-dir: ${{ vars.HOSTERBY_SERVER_DIR || './public_html/' }}
          dangerous-clean-slate: false
